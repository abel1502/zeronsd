[package]
name = "zeronsd-integration-tests"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
zeronsd = { path = "../zeronsd" }
zerotier-api = { path = "../zerotier-api" }

[features]
default = []
integration-tests = []

[[test]]
name = "integration"
path = "integration.rs"

[dependencies]
anyhow = "1.0.89"
async-trait = "0.1.83"
ctor = "0.2.8"
hickory-dns = { version = "0.25.2", features = ["dnssec-ring", "tls-ring", "https-ring", "quic-ring", "h3-ring"] }
ipnetwork = "0.20.0"
rand = "0.8.5"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
tokio = { version = "1.40.0", features = ["rt-multi-thread"] }
tracing = "0.1.40"
